# .github/workflows/build.yml
name: Android CI

# 1. 触发条件：当代码推送到 main 分支时触发[reference:2]
on:
  push:
    branches: [ main ]
  # 允许手动触发[reference:3]
  workflow_dispatch:

jobs:
  build:
    # 2. 运行环境：使用最新版 Ubuntu[reference:4]
    runs-on: ubuntu-latest

    steps:
    # 3. 拉取代码[reference:6]
    - name: Checkout code
      uses: actions/checkout@v4

    # 4. 设置 Java 环境[reference:8]
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # 5. 赋予 Gradle 执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. 构建 Debug APK[reference:9]
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    # 7. 上传产物[reference:10]
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
